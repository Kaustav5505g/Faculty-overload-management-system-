<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Workload Check</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top-bar">
  <div class="top-bar-inner">
    <h1>Faculty Workload Check</h1>
    <div class="dept">Manipal University Jaipur, Department of Computer Science and Engineering</div>
  </div>
</header>

<main class="page-content">
  <div class="panel">
    <p class="panel-title">Check a new subject assignment</p>

    <form id="assignForm" novalidate>

      <!-- Faculty -->
      <div class="form-group">
        <label for="selFaculty">Faculty member</label>
        <select id="selFaculty" aria-describedby="errFaculty">
          <option value="">— Select faculty —</option>
        </select>
        <span class="field-error" id="errFaculty" role="alert"></span>
        <!-- Load summary injected here by JS -->
        <div id="loadInfo" class="load-info" hidden></div>
      </div>

      <!-- Subject -->
      <div class="form-group">
        <label for="selSubject">Subject</label>
        <select id="selSubject" aria-describedby="errSubject">
          <option value="">— Select subject —</option>
        </select>
        <span class="field-error" id="errSubject" role="alert"></span>
      </div>

      <!-- Semester -->
      <div class="form-group">
        <label for="selSemester">Semester</label>
        <select id="selSemester" aria-describedby="errSemester">
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3" selected>Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
          <option value="7">Semester 7</option>
          <option value="8">Semester 8</option>
        </select>
        <span class="field-error" id="errSemester" role="alert"></span>
      </div>

      <!-- Academic year -->
      <div class="form-group">
        <label for="inputYear">Academic year</label>
        <input
          type="text"
          id="inputYear"
          value="2026-2027"
          placeholder="e.g. 2026-2027"
          pattern="\d{4}-\d{4}"
          maxlength="9"
          aria-describedby="errYear"
        >
        <span class="field-error" id="errYear" role="alert"></span>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Check assignment</button>
      </div>

    </form>
  </div><!-- /.panel -->
</main>

<script src="js/data.js"></script>
<script src="js/workload.js"></script>
<script>
(function () {
  "use strict";

  const selFaculty  = document.getElementById("selFaculty");
  const selSubject  = document.getElementById("selSubject");
  const selSemester = document.getElementById("selSemester");
  const inputYear   = document.getElementById("inputYear");
  const loadInfo    = document.getElementById("loadInfo");
  const form        = document.getElementById("assignForm");

  // ── Populate faculty dropdown ────────────────────────────────────────────
  FACULTY.forEach(function (f) {
    const opt = document.createElement("option");
    opt.value = f.id;
    opt.textContent = f.name + " — " + f.designation;
    selFaculty.appendChild(opt);
  });

  // ── Populate subject dropdown ────────────────────────────────────────────
  function buildSubjectOptions() {
    // Remove all but the placeholder
    while (selSubject.options.length > 1) selSubject.remove(1);

    SUBJECTS.forEach(function (s) {
      const opt = document.createElement("option");
      opt.value = s.id;
      const labNote = s.type === "LAB" ? " (counts twice)" : "";
      opt.textContent = s.code + " — " + s.title + " | " + s.type + " | " + s.weeklyHours + " h/wk" + labNote;
      selSubject.appendChild(opt);
    });
  }
  buildSubjectOptions();

  // ── Update load info box whenever faculty/semester/year changes ──────────
  function updateLoadInfo() {
    const fid  = parseInt(selFaculty.value, 10);
    const sem  = parseInt(selSemester.value, 10);
    const year = inputYear.value.trim();

    if (!fid || !year) { loadInfo.hidden = true; return; }

    const faculty   = FACULTY.find(function (f) { return f.id === fid; });
    const assigned  = getAssignedSubjects(fid, sem, year);
    const load      = assigned.reduce(function (sum, s) { return sum + workloadHours(s); }, 0);

    let html = "<strong>Currently assigned: " + load + " of " + faculty.maxHours + " hours</strong> in semester " + sem + ", " + year;

    if (assigned.length === 0) {
      html += "<br><span class='none'>No subjects assigned in this semester and year.</span>";
    } else {
      html += "<ul>";
      assigned.forEach(function (s) {
        const hrs = workloadHoursLabel(s);
        html += "<li>" + s.code + " " + s.title + " (" + s.type + ") — " + hrs + " h</li>";
      });
      html += "</ul>";
    }

    loadInfo.innerHTML = html;
    loadInfo.hidden = false;
  }

  selFaculty.addEventListener("change",  updateLoadInfo);
  selSemester.addEventListener("change", updateLoadInfo);
  inputYear.addEventListener("input",    updateLoadInfo);

  // ── Show/hide LAB note on subject select ────────────────────────────────
  selSubject.addEventListener("change", function () {
    // remove any old note
    const old = document.getElementById("labHint");
    if (old) old.remove();

    const sid = parseInt(selSubject.value, 10);
    const sub = SUBJECTS.find(function (s) { return s.id === sid; });
    if (sub && sub.type === "LAB") {
      const note = document.createElement("span");
      note.id = "labHint";
      note.className = "lab-note";
      note.textContent = "LAB — counts as " + (sub.weeklyHours * 2) + " h (weekly hours x 2)";
      selSubject.parentNode.insertBefore(note, selSubject.nextSibling);
    }
  });

  // ── Validation helpers ───────────────────────────────────────────────────
  function showError(id, msg) {
    document.getElementById(id).textContent = msg;
  }
  function clearErrors() {
    ["errFaculty", "errSubject", "errSemester", "errYear"].forEach(function (id) {
      document.getElementById(id).textContent = "";
    });
  }

  function yearValid(val) {
    return /^\d{4}-\d{4}$/.test(val);
  }

  // ── Form submit → navigate to result.html ───────────────────────────────
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    clearErrors();

    let ok = true;

    if (!selFaculty.value) {
      showError("errFaculty", "Please select a faculty member.");
      ok = false;
    }
    if (!selSubject.value) {
      showError("errSubject", "Please select a subject.");
      ok = false;
    }
    const sem = parseInt(selSemester.value, 10);
    if (!sem || sem < 1 || sem > 8) {
      showError("errSemester", "Please select a semester.");
      ok = false;
    }
    const year = inputYear.value.trim();
    if (!yearValid(year)) {
      showError("errYear", "Enter a year in the format 2026-2027.");
      ok = false;
    }

    if (!ok) return;

    const params = new URLSearchParams({
      faculty:  selFaculty.value,
      subject:  selSubject.value,
      semester: selSemester.value,
      year:     year,
    });
    window.location.href = "result.html?" + params.toString();
  });

}());
</script>

</body>
</html>
